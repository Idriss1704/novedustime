<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="#{adminpreferences.adminpreferences}"></title>
<!-- Favicon icon -->
<link rel="icon" type="image/png" sizes="16x16"
	href="/webresources/images/favicon.png">
<!-- Custom Stylesheet -->
<link
	href="/webresources/plugins/bootstrap-material-datetimepicker/css/bootstrap-material-datetimepicker.css"
	rel="stylesheet">
<!-- Page plugins css -->
<link
	href="/webresources/plugins/clockpicker/dist/jquery-clockpicker.min.css"
	rel="stylesheet">
<!-- Color picker plugins css -->
<link
	href="/webresources/plugins/jquery-asColorPicker-master/css/asColorPicker.css"
	rel="stylesheet">
<!-- Date picker plugins css -->
<link
	href="/webresources/plugins/bootstrap-datepicker/bootstrap-datepicker.min.css"
	rel="stylesheet">
<!-- Daterange picker plugins css -->
<link
	href="/webresources/plugins/timepicker/bootstrap-timepicker.min.css"
	rel="stylesheet">
<link
	href="/webresources/plugins/bootstrap-daterangepicker/daterangepicker.css"
	rel="stylesheet">

<link href="/webresources/css/style.css" rel="stylesheet">
<!-- fontawesome-free -->
<link rel="stylesheet"
	href="/webresources/vendor/fontawesome-free/css/all.css">
<link href="/webresources/plugins/fullcalendar/css/fullcalendar.min.css"
	rel="stylesheet">

<link href="/webresources/plugins/select2/css/select2.min.css"
	rel="stylesheet">

</head>

<body>

	<!--*******************
        Preloader start
    ********************-->
	<div id="preloader">
		<div class="loader">
			<svg class="circular" viewBox="25 25 50 50">
                <circle class="path" cx="50" cy="50" r="20" fill="none"
					stroke-width="3" stroke-miterlimit="10" />
            </svg>
		</div>
	</div>
	<!--*******************
        Preloader end
    ********************-->


	<!--**********************************
        Main wrapper start
    ***********************************-->
	<div id="main-wrapper">

		<!--**********************************
            Nav header start
        ***********************************-->
		<div th:insert="navheader :: navheader"></div>
		<!--**********************************
            Nav header end
        ***********************************-->

		<!--**********************************
            Header start
        ***********************************-->
		<div th:insert="header :: header"></div>
		<!--**********************************
            Header end ti-comment-alt
        ***********************************-->

		<!--**********************************
            Sidebar start
        ***********************************-->
		<div th:insert="sidebar :: sidebar"></div>
		<!--**********************************
            Sidebar end
        ***********************************-->

		<!--**********************************
            Content body start
        ***********************************-->
		<div class="content-body">

			<div class="row page-titles mx-0">
				<div class="col p-md-0">
					<h3 style="color: skyblue"
						th:text="#{adminpreferences.adminpreferences}"></h3>
				</div>
			</div>
			<!-- row -->

			<div class="container-fluid">
				<form class="form-valide" action="#"
					th:action="@{/admin/preferences}" th:object="${adminPreferences}"
					method="post" enctype="multipart/form-data">
					<input type="hidden" class="form-control" th:field="*{id}" /> <input
						type="hidden" class="form-control" th:field="*{minPause1.id}" />
					<input type="hidden" class="form-control"
						th:field="*{minPause2.id}" />
					<div class="row">

						<div class="col-6">
							<!-- Card -->
							<div class="card">
								<div class="card-body">
									<h4 class="card-title"
										th:text="#{adminpreferences.companyprefs}"></h4>
									<div class="form-validation">
										<input type="hidden" class="form-control" th:field="*{id}" />
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.companyname} +' *'"></label>
											<div class="col-lg-6">
												<input type="text" class="form-control"
													th:field="*{companyName}" th:required="required"
													th:placeholder="#{adminpreferences.companyname}" />
												<div class="alert alert-danger"
													th:if="${#fields.hasErrors('companyName')}"
													th:errors="*{companyName}"></div>
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.companyemail}"> </label>
											<div class="col-lg-6">
												<input type="text" class="form-control"
													th:field="*{companyEmail}"
													th:placeholder="#{adminpreferences.companyemail}" />
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.companytel}"> </label>
											<div class="col-lg-6">
												<input type="text" class="form-control"
													th:field="*{companyTel}"
													th:placeholder="#{adminpreferences.companytel}"></input>
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.companyaddress}"> </label>
											<div class="col-lg-6">
												<input type="text" class="form-control"
													th:field="*{companyAddress}"
													th:placeholder="#{adminpreferences.companyaddress}"></input>
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.companylogo}"> </label>
											<div class="col-lg-6">
												<input type="file" class="form-control"
													th:field="*{companyLogo}">
												<div class="alert alert-danger"
													th:if="${#fields.hasErrors('companyLogo')}"
													th:errors="*{companyLogo}"></div>
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.bgimage}"> </label>
											<div class="col-lg-6">
												<input type="file" class="form-control"
													th:field="*{bgImage}">
												<div class="alert alert-danger"
													th:if="${#fields.hasErrors('bgImage')}"
													th:errors="*{bgImage}"></div>
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.countryandstate} + ' *'"></label>
											<div class="col-lg-6">
												<select class="form-control" th:field="*{countryState}"
													th:required="required">
													<option value="" th:text="#{general.pleaseselect}"></option>
													<option
														th:each="method : ${T(bf.novedus.novedustime.enums.CountryAndState).values()}"
														th:value="${method}" th:text="#{${method.label}}"></option>
												</select>
											</div>
										</div>
										<button type="submit" class="btn btn-primary"
											th:text="#{general.submit}"></button>
									</div>
								</div>
							</div>
						</div>




						<div class="col-6">
							<!-- Card -->
							<div class="card">
								<div class="card-body">
									<h4 class="card-title"
										th:text="#{adminpreferences.workingtimeprefsprefs}"></h4>
									<div class="form-validation">
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.defaultdayhours}"></label>
											<div class="col-lg-6">
												<input type="number" class="form-control"
													th:field="*{defaultDayHours}" th:required="required"
													th:placeholder="#{adminpreferences.defaultdayhours}" />
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.maxdailyhours}"> </label>
											<div class="col-lg-6">
												<input type="number" class="form-control"
													th:field="*{maxDailyHours}"
													th:placeholder="#{adminpreferences.maxdailyhours}"></input>
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.vacationsperyear}"> </label>
											<div class="col-lg-6">
												<input type="number" class="form-control"
													th:field="*{vacationsPerYear}"
													th:placeholder="#{adminpreferences.vacationsperyear}" />
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{general.workingdays}"> </label>
											<div class="col-lg-6">
												<select id="daysOfWeek"
													class="form-control select2-multiple"
													th:field="*{dayOfWeekIds}" multiple="multiple">
													<option th:each="day : ${adminPreferences.daysOfWeek}"
														th:value="${day.number}" th:text="#{${day.name}}"
														th:selected="${#lists.contains(adminPreferences.dayOfWeekIds,day.number)}">
													</option>
												</select>
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{adminpreferences.vacexpyear} + ' *'"></label>
											<div class="col-lg-3">
												<select class="form-control"
													th:field="*{vacationExpirationYear}" th:required="required">
													<option value="" th:text="#{general.pleaseselect}"></option>
													<option
														th:each="method : ${T(bf.novedus.novedustime.enums.VacationExpirationYear).values()}"
														th:value="${method}" th:text="#{${method.label}}"></option>
												</select>
											</div>
											<input th:field="*{expDateString}" type="text"
												class="form-control col-lg-3"></input>
										</div>
										<button type="submit" class="btn btn-primary"
											th:text="#{general.submit}"></button>
									</div>
								</div>
							</div>

						</div>







						<div class="col-6">
							<!-- Card -->
							<div class="card">
								<div class="card-body">
									<h4 class="card-title" th:text="#{adminpreferences.minpauses}"></h4>
									<div class="row">
										<div class="col-md-6">
											<label class="m-t-20" th:text="#{adminpreferences.after}"></label>
											<div class="input-group clockpicker" data-autoclose="true">
												<input type="time" class="form-control"
													th:field="*{minPause1.time}"> <span
													class="input-group-append"><span
													class="input-group-text"><i class="fa fa-clock-o"></i></span></span>
											</div>
											<div class="input-group clockpicker" data-autoclose="true">
												<input type="time" class="form-control"
													th:field="*{minPause2.time}"> <span
													class="input-group-append"><span
													class="input-group-text"><i class="fa fa-clock-o"></i></span></span>
											</div>
											<label class="m-t-40"></label>
										</div>
										<div class="col-md-6">

											<label class="m-t-20" th:text="#{adminpreferences.minpause}"></label>
											<div class="input-group clockpicker" data-autoclose="true">
												<input type="time" class="form-control"
													th:field="*{minPause1.minPause}"> <span
													class="input-group-append"><span
													class="input-group-text"><i class="fa fa-clock-o"></i></span></span>
											</div>

											<div class="input-group clockpicker" data-autoclose="true">
												<input type="time" class="form-control"
													th:field="*{minPause2.minPause}"> <span
													class="input-group-append"><span
													class="input-group-text"><i class="fa fa-clock-o"></i></span></span>
											</div>
											<label class="m-t-40"></label>

										</div>
										<button type="submit" class="btn btn-primary"
											th:text="#{general.submit}"></button>

									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
			<!-- #/ container -->
		</div>
		<!--**********************************
            Content body end
        ***********************************-->


		<!--**********************************
            Footer start
        ***********************************-->
		<div th:insert="footer :: footer"></div>
		<!--**********************************
            Footer end
        ***********************************-->
	</div>
	<!--**********************************
        Main wrapper end
    ***********************************-->

	<!--**********************************
        Scripts
    ***********************************-->
	<script src="/webresources/plugins/common/common.min.js"></script>
	<script src="/webresources/js/custom.min.js"></script>
	<script src="/webresources/js/settings.js"></script>
	<script src="/webresources/js/gleek.js"></script>
	<script src="/webresources/js/styleSwitcher.js"></script>

	<script src="/webresources/plugins/moment/moment.js"></script>
	<script
		src="/webresources/plugins/bootstrap-material-datetimepicker/js/bootstrap-material-datetimepicker.js"></script>
	<!-- Clock Plugin JavaScript -->
	<script
		src="/webresources/plugins/clockpicker/dist/jquery-clockpicker.min.js"></script>
	<!-- Color Picker Plugin JavaScript -->
	<script
		src="/webresources/plugins/jquery-asColorPicker-master/libs/jquery-asColor.js"></script>
	<script
		src="/webresources/plugins/jquery-asColorPicker-master/libs/jquery-asGradient.js"></script>
	<script
		src="/webresources/plugins/jquery-asColorPicker-master/dist/jquery-asColorPicker.min.js"></script>
	<!-- Date Picker Plugin JavaScript -->
	<script
		src="/webresources/plugins/bootstrap-datepicker/bootstrap-datepicker.min.js"></script>
	<!-- Date range Plugin JavaScript -->
	<script
		src="/webresources/plugins/timepicker/bootstrap-timepicker.min.js"></script>
	<script
		src="/webresources/plugins/bootstrap-daterangepicker/daterangepicker.js"></script>

	<script src="/webresources/js/plugins-init/form-pickers-init.js"></script>

	<script src="/webresources/plugins/select2/js/select2.full.min.js"></script>
	<!-- fontawesome-free -->
	<script src="/webresources/vendor/fontawesome-free/js/all.js"></script>

	<script src="/webresources/plugins/fullcalendar/js/fullcalendar.min.js"></script>
	<script src="/webresources/js/plugins-init/fullcalendar-init.js"></script>
	<script src="/webresources/js/dashboard/dashboard-1.js"></script>

	<script th:inline="javascript">
		$("#daysOfWeek").select2({
			ajax : {
				url : '/getWeekDays/' + [[${#locale}]],
				dataType : 'json',
				delay : 250,
				processResults : function(response) {
					return {
						results : $.map(response, function(obj) {
							return {
								id : obj.number,
								text : obj.displayName
							};
						})
					};
				},
				cache : true
			}
		});
	</script>
	<script type="text/javascript">
	$.fn.datepicker.dates.en.titleFormat="MM";
	$(document).ready(function(){
	    var date_input=$('input[name="expDateString"]'); 
	    date_input.datepicker({
	      format: 'dd.mm',
	      autoclose: true,
	      startView: 0,
	      maxViewMode: "months",
	      orientation: "bottom left",
	    })
	  });
	</script>

</body>

</html>
