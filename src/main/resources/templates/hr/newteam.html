<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="#{sidebar.newteam}"></title>
<!-- Favicon icon -->
<link rel="icon" type="image/png" sizes="16x16"
	href="/webresources/images/favicon.png">
<!-- Custom Stylesheet -->
<link href="/webresources/css/style.css" rel="stylesheet">
<!-- fontawesome-free -->
<link rel="stylesheet"
	href="/webresources/vendor/fontawesome-free/css/all.css">


<link href="/webresources/plugins/select2/css/select2.min.css"
	rel="stylesheet">


</head>

<body>

	<!--*******************
        Preloader start
    ********************-->
	<div id="preloader">
		<div class="loader">
			<svg class="circular" viewBox="25 25 50 50">
                <circle class="path" cx="50" cy="50" r="20" fill="none"
					stroke-width="3" stroke-miterlimit="10" />
            </svg>
		</div>
	</div>
	<!--*******************
        Preloader end
    ********************-->


	<!--**********************************
        Main wrapper start
    ***********************************-->

	<!--**********************************
            Nav header start
        ***********************************-->
	<div th:insert="navheader :: navheader"></div>
	<!--**********************************
            Nav header end
        ***********************************-->
	<div th:insert="header :: header"></div>
	<!--**********************************
            Header end ti-comment-alt
        ***********************************-->

	<!--**********************************
            Sidebar start
        ***********************************-->
	<div th:insert="sidebar :: sidebar"></div>
	<!--**********************************
            Sidebar end
        ***********************************-->

	<!--**********************************
            Content body start
        ***********************************-->
	<div class="content-body">

		<div class="row page-titles mx-0">
			<div class="col p-md-0">
				<h3 style="color: skyblue"
					th:text="${team.id <= 0} ? #{sidebar.newteam} : #{sidebar.editteam}"></h3>
			</div>
		</div>
		<!-- row -->

		<div class="container-fluid">
			<div class="row justify-content-center">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<div class="form-validation">
								<form class="form-valide" action="#" th:action="@{/hr/newteam}"
									th:object="${team}" method="post" enctype="multipart/form-data">
									<input type="hidden" class="form-control" th:field="*{id}" />
									<input type="hidden" class="form-control"
										th:field="*{logoPath}" />
									<div class="form-group row">
										<label class="col-lg-4 col-form-label"
											th:text="#{newteam.teamname} + ' *'"> <span
											class="text-danger">*</span>
										</label>
										<div class="col-lg-6">
											<input type="text" class="form-control" th:field="*{name}"
												th:required="required"
												th:placeholder="#{newteam.teamnameplholder}" />
											<div class="alert alert-danger"
												th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-lg-4 col-form-label"
											th:text="#{newteam.teamid}"> <span
											class="text-danger">*</span>
										</label>
										<div class="col-lg-6">
											<input type="text" class="form-control" th:field="*{teamid}"
												th:placeholder="#{newteam.teamidplholder}">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-lg-4 col-form-label"
											th:text="#{newteam.leadername}"> <span
											class="text-danger">*</span>
										</label>
										<div class="col-lg-6">
											<select id="teamleader" class="form-control select2-single"
												th:field="*{leaderId}">
												<option value="-10" th:text="#{general.pleaseselect}"></option>
												<option th:each="user : ${users}" th:value="${{user.id}}"
													th:text="${user.getFullName()}"
													th:selected="${#lists.contains(team.leaderId,user.id)}">
												</option>
											</select>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-lg-4 col-form-label" th:text="#{newteam.hr}">
											<span class="text-danger">*</span>
										</label>
										<div class="col-lg-6">
											<select id="teamhr" class="form-control select2-single"
												th:field="*{hrId}">
												<option value="-10" th:text="#{general.pleaseselect}"></option>
												<option th:each="user : ${users}" th:value="${{user.id}}"
													th:text="${user.getFullName()}"
													th:selected="${#lists.contains(team.hrId,user.id)}">
												</option>
											</select>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-lg-4 col-form-label"
											th:text="#{newteam.members}"> </label>
										<div class="col-lg-6">
											<select id="teammembers"
												class="form-control select2-multiple"
												th:field="*{memberIds}" multiple="multiple">
												<option th:each="member : ${team.members}"
													th:value="${{member.id}}" th:text="${member.getFullName()}"
													th:selected="${#lists.contains(team.memberIds,member.id)}">
												</option>
											</select>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-lg-4 col-form-label"
											th:text="#{newteam.email}"> <span class="text-danger">*</span>
										</label>
										<div class="col-lg-6">
											<input type="email" class="form-control" th:field="*{email}"
												th:placeholder="#{newteam.emailplholder}">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-lg-4 col-form-label"
											th:text="#{newteam.teamlogo}"> </label>
										<div class="col-lg-6">
											<input type="file" class="form-control" th:field="*{logo}">
											<div class="alert alert-danger"
												th:if="${#fields.hasErrors('logo')}" th:errors="*{logo}"></div>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-lg-4 col-form-label"
											th:text="#{newteam.comment}"> </label>
										<div class="col-lg-6">
											<textarea class="form-control" rows="1" th:field="*{comment}"
												th:placeholder="#{newteam.commentplholder}"></textarea>
										</div>
									</div>

									<div class="form-group row">
										<div class="col-lg-8 ml-auto">
											<button type="submit" class="btn btn-primary"
												th:text="#{general.submit}"></button>
										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- #/ container -->
	<!--**********************************
            Content body end
        ***********************************-->


	<!--**********************************
            Footer start
        ***********************************-->
	<div th:insert="footer :: footer"></div>
	<!--**********************************
        Main wrapper end
    ***********************************-->

	<!--**********************************
        Scripts
    ***********************************-->
	<script src="/webresources/plugins/common/common.min.js"></script>
	<script src="/webresources/js/custom.min.js"></script>
	<script src="/webresources/js/settings.js"></script>
	<script src="/webresources/js/gleek.js"></script>
	<script src="/webresources/js/styleSwitcher.js"></script>
	<script src="/webresources/vendor/bootstrap/js/bootstrap.min.js"></script>

	<!-- Datamap -->
	<script src="/webresources/plugins/d3v3/index.js"></script>
	<script src="/webresources/plugins/topojson/topojson.min.js"></script>
	<script src="/webresources/plugins/datamaps/datamaps.world.min.js"></script>
	<!-- Morrisjs -->
	<script src="/webresources/plugins/raphael/raphael.min.js"></script>
	<script src="/webresources/plugins/morris/morris.min.js"></script>
	<script src="/webresources/plugins/moment/moment.min.js"></script>
	<!-- ChartistJS -->
	<script src="/webresources/plugins/chartist/js/chartist.min.js"></script>
	<script
		src="/webresources/plugins/chartist-plugin-tooltips/js/chartist-plugin-tooltip.min.js"></script>
	<!-- fontawesome-free -->
	<script src="/webresources/vendor/fontawesome-free/js/all.js"></script>

	<script src="/webresources/plugins/jquery/jquery.min.js"></script>
	<script src="/webresources/plugins/select2/js/select2.full.min.js"></script>



	<script>
		$("#teamleader").select2({
			ajax : {
				url : '/getUserList',
				dataType : 'json',
				delay : 250,
				processResults : function(response) {
					return {
						results : $.map(response, function(obj) {
							return {
								id : obj.id,
								text : obj.firstName + ' ' + obj.lastName
							};
						})
					};
				},
				cache : true
			}
		});
	</script>

	<script>
		$("#teamhr").select2({
			ajax : {
				url : '/getUserList',
				dataType : 'json',
				delay : 250,
				processResults : function(response) {
					return {
						results : $.map(response, function(obj) {
							return {
								id : obj.id,
								text : obj.firstName + ' ' + obj.lastName
							};
						})
					};
				},
				cache : true
			}
		});
	</script>

	<script>
		$("#teammembers").select2({
			ajax : {
				url : '/getUserList',
				dataType : 'json',
				delay : 250,
				processResults : function(response) {
					return {
						results : $.map(response, function(obj) {
							return {
								id : obj.id,
								text : obj.firstName + ' ' + obj.lastName
							};
						})
					};
				},
				cache : true

			}
		});
	</script>

</body>

</html>
