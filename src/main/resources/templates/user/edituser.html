<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="#{myprofile.edit}"></title>
<!-- Favicon icon -->
<link rel="icon" type="image/png" sizes="16x16"
	href="/webresources/images/favicon.png">
<!-- Pignose Calender -->
<link
	href="/webresources/plugins/pg-calendar/css/pignose.calendar.min.css"
	rel="stylesheet">
<!-- Chartist -->
<link rel="stylesheet"
	href="/webresources/plugins/chartist/css/chartist.min.css">
<link rel="stylesheet"
	href="/webresources/plugins/chartist-plugin-tooltips/css/chartist-plugin-tooltip.css">
<!-- Custom Stylesheet -->
<link href="/webresources/css/style.css" rel="stylesheet">
<!-- fontawesome-free -->
<link rel="stylesheet"
	href="/webresources/vendor/fontawesome-free/css/all.css">
<link href="/webresources/plugins/fullcalendar/css/fullcalendar.min.css"
	rel="stylesheet">

</head>

<body>

	<!--*******************
        Preloader start
    ********************-->
	<div id="preloader">
		<div class="loader">
			<svg class="circular" viewBox="25 25 50 50">
                <circle class="path" cx="50" cy="50" r="20" fill="none"
					stroke-width="3" stroke-miterlimit="10" />
            </svg>
		</div>
	</div>
	<!--*******************
        Preloader end
    ********************-->


	<!--**********************************
        Main wrapper start
    ***********************************-->
	<div id="main-wrapper">

		<!--**********************************
            Nav header start
        ***********************************-->
		<div th:insert="navheader :: navheader"></div>
		<!--**********************************
            Nav header end
        ***********************************-->

		<!--**********************************
            Header start
        ***********************************-->
		<div th:insert="header :: header"></div>
		<!--**********************************
            Header end ti-comment-alt
        ***********************************-->

		<!--**********************************
            Sidebar start
        ***********************************-->
		<div th:insert="sidebar :: sidebar"></div>
		<!--**********************************
            Sidebar end
        ***********************************-->

		<!--**********************************
            Content body start
        ***********************************-->
		<div class="content-body">

			<div class="row page-titles mx-0">
				<div class="col p-md-0">
					<h3 style="color: skyblue" th:text="#{myprofile.edit}"></h3>
				</div>
			</div>
			<!-- row -->

			<div class="container-fluid">
				<div class="row justify-content-center">
					<div class="col-lg-12">
						<div class="card">
							<div class="card-body">
								<div class="form-validation">
									<form class="form-valide" action="#" th:action="@{/user/editprofile}"
										th:object="${user}" method="post"
										enctype="multipart/form-data">
										<input type="hidden" class="form-control" th:field="*{id}" />
										<input type="hidden" class="form-control"
											th:field="*{alreadyUsed}" /> <input type="hidden"
											class="form-control" th:field="*{imgPath}" /> <input
											type="hidden" class="form-control" th:field="*{teamId}" /> <input
											type="hidden" class="form-control" th:field="*{gender}" /> <input
											type="hidden" class="form-control" th:field="*{userName}" />
										<input type="hidden" class="form-control"
											th:field="*{firstName}" /> <input type="hidden"
											class="form-control" th:field="*{lastName}" /> <input
											type="hidden" class="form-control" th:field="*{roleName}" />
										<input type="hidden" class="form-control"
											th:field="*{weekDays}" /> <input type="hidden"
											class="form-control" th:field="*{weekHours}" /> <input
											type="hidden" class="form-control"
											th:field="*{vacationCount}" /> <input type="hidden"
											class="form-control" th:field="*{active}" /> <input
											type="hidden" class="form-control" th:field="*{comment}" />

										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{newuser.email} + ' *'"> </label>
											<div class="col-lg-6">
												<input type="email" class="form-control" th:field="*{email}"
													th:required="required"
													th:placeholder="#{newuser.emailplholder}" />
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{newuser.tel} + ' *'"> </label>
											<div class="col-lg-6">
												<input type="text" class="form-control"
													th:field="*{telephone}" th:required="required"
													th:placeholder="#{newuser.telplholder}" />
											</div>
										</div>
										<div class="form-group row">
											<label class="col-lg-4 col-form-label"
												th:text="#{newuser.image}"> </label>
											<div class="col-lg-6">
												<input type="file" class="form-control" th:field="*{image}">
												<div class="alert alert-danger"
													th:if="${#fields.hasErrors('image')}"
													th:text="#{general.filetoobig}"></div>
											</div>
										</div>
										<div class="form-group row">
											<div class="col-lg-8 ml-auto">
												<button type="submit" class="btn btn-primary"
													th:text="#{general.submit}"></button>
											</div>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- #/ container -->
	</div>
	<!--**********************************
            Content body end
        ***********************************-->


	<!--**********************************
            Footer start
        ***********************************-->
	<div th:insert="footer :: footer"></div>
	<!--**********************************
        Main wrapper end
    ***********************************-->

	<!--**********************************
        Scripts
    ***********************************-->
	<script src="/webresources/plugins/common/common.min.js"></script>
	<script src="/webresources/js/custom.min.js"></script>
	<script src="/webresources/js/settings.js"></script>
	<script src="/webresources/js/gleek.js"></script>
	<script src="/webresources/js/styleSwitcher.js"></script>

	<!-- Chartjs -->
	<script src="/webresources/plugins/chart.js/Chart.bundle.min.js"></script>
	<!-- Circle progress -->
	<script
		src="/webresources/plugins/circle-progress/circle-progress.min.js"></script>
	<!-- Datamap -->
	<script src="/webresources/plugins/d3v3/index.js"></script>
	<script src="/webresources/plugins/topojson/topojson.min.js"></script>
	<script src="/webresources/plugins/datamaps/datamaps.world.min.js"></script>
	<!-- Morrisjs -->
	<script src="/webresources/plugins/raphael/raphael.min.js"></script>
	<script src="/webresources/plugins/morris/morris.min.js"></script>
	<!-- Pignose Calender -->
	<script src="/webresources/plugins/moment/moment.min.js"></script>
	<script
		src="/webresources/plugins/pg-calendar/js/pignose.calendar.min.js"></script>
	<!-- ChartistJS -->
	<script src="/webresources/plugins/chartist/js/chartist.min.js"></script>
	<script
		src="/webresources/plugins/chartist-plugin-tooltips/js/chartist-plugin-tooltip.min.js"></script>
	<!-- fontawesome-free -->
	<script src="/webresources/vendor/fontawesome-free/js/all.js"></script>

	<script src="/webresources/plugins/fullcalendar/js/fullcalendar.min.js"></script>
	<script src="/webresources/js/plugins-init/fullcalendar-init.js"></script>
	<script src="/webresources/js/dashboard/dashboard-1.js"></script>

</body>

</html>
